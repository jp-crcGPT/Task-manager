<!doctype html>
<html lang="en">
<head>
<!-- deploy-head -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F131B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MVD">
<script>try { var mvdTheme = localStorage.getItem('mvd-v1-theme'); if (mvdTheme === 'light' || mvdTheme === 'dark') document.documentElement.setAttribute('data-theme', mvdTheme); } catch (e) {}</script>
<!-- /deploy-head -->
<title>Minimum Viable Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root {
  /* Layout: one working column; a bottom tab bar on phones, a left rail from 900px wide. */
  --paper: #F3F4F7;
  --card: #FFFFFF;
  --sunk: #E9EBF1;
  --ink: #182033;
  --ink-2: #4F5A6E;
  --ink-3: #737C90;
  --line: #DEE1E9;
  --line-2: #C6CBD7;
  --accent: #2443B5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E5EAFA;
  --accent-line: #B9C6EF;
  --high: #B42318;
  --med: #95560A;
  --low: #5B6578;
  --done: #1C7748;
  --done-ink: #FFFFFF;
  --done-soft: #E1F2E8;
  --warn: #8A5000;
  --warn-soft: #FFF1D3;
  --shadow: 0 1px 2px rgba(24, 32, 51, .06), 0 6px 20px rgba(24, 32, 51, .07);
  --scrim: rgba(14, 18, 26, .42);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --nav-h: 64px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F131B; --card: #171D28; --sunk: #1F2633; --ink: #E7EAF1; --ink-2: #A9B1C2; --ink-3: #8790A4;
    --line: #273042; --line-2: #364055; --accent: #8FA6FF; --accent-ink: #0F131B; --accent-soft: #1C2644; --accent-line: #34457A;
    --high: #FF8B7B; --med: #F2B45C; --low: #A9B1C2; --done: #5DCB8F; --done-ink: #0F131B; --done-soft: #13301F;
    --warn: #F2B45C; --warn-soft: #33270F; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F131B; --card: #171D28; --sunk: #1F2633; --ink: #E7EAF1; --ink-2: #A9B1C2; --ink-3: #8790A4;
  --line: #273042; --line-2: #364055; --accent: #8FA6FF; --accent-ink: #0F131B; --accent-soft: #1C2644; --accent-line: #34457A;
  --high: #FF8B7B; --med: #F2B45C; --low: #A9B1C2; --done: #5DCB8F; --done-ink: #0F131B; --done-soft: #13301F;
  --warn: #F2B45C; --warn-soft: #33270F; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }
a { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
main {
  max-width: 680px; margin: 0 auto; outline: none;
  padding-block: 14px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 2px;
  background: var(--card); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.nav .brand, .nav .rail-extra { display: none; }
.nav-btn {
  position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 2px; border: 0; border-radius: 10px; background: none; color: var(--ink-3);
  font-size: 12px; font-weight: 500; cursor: pointer;
}
.nav-btn[aria-current="page"] { color: var(--accent); }
.nav-btn .dot { position: absolute; top: 5px; left: calc(50% + 8px); width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.fab {
  position: fixed; z-index: 21; width: 56px; height: 56px; border: 0; border-radius: 16px; cursor: pointer;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); display: grid; place-items: center;
}
@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); align-items: start; }
  .nav {
    position: sticky; top: 0; bottom: auto; height: 100vh; flex-direction: column; gap: 4px;
    border-top: 0; border-right: 1px solid var(--line); padding: 22px 14px;
  }
  .nav .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
  .nav .rail-extra { display: grid; gap: 8px; margin-top: auto; padding: 0 4px; }
  .nav-btn { flex: 0 0 auto; flex-direction: row; gap: 12px; padding: 10px 12px; font-size: 15px; justify-content: flex-start; color: var(--ink-2); }
  .nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .nav-btn .dot { top: 50%; left: auto; right: 12px; transform: translateY(-50%); }
  main { padding-block: 36px 72px; }
  .fab { display: none; }
}
.brand .mark {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px;
  background: var(--accent); color: var(--accent-ink); font: 700 13px/1 var(--font-display); letter-spacing: .02em;
}
.brand-name { font: 700 17px/1.15 var(--font-display); }
.kbd-hint { font-size: 12.5px; color: var(--ink-3); text-align: center; }
kbd { font: 500 11.5px var(--font-mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

/* ---------- type ---------- */
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.view-head > div:first-child { min-width: 0; }
.eyebrow, .label { font: 500 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.h1 { font: 700 32px/1.08 var(--font-display); letter-spacing: -.012em; margin: 4px 0 0; text-wrap: balance; }
.h2 { font: 700 19px/1.25 var(--font-display); margin: 0; text-wrap: balance; }
.muted { color: var(--ink-2); }
.hint { font-size: 13.5px; color: var(--ink-3); }
.lede { color: var(--ink-2); max-width: 60ch; margin-bottom: 14px; }
.error { color: var(--high); font-size: 14px; font-weight: 500; }
code { font: 500 12.5px var(--font-mono); background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.section { margin-top: 30px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 15px;
  border: 1px solid var(--line-2); border-radius: 9px; background: var(--card); color: var(--ink);
  font-weight: 500; font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunk); }
.btn.small { min-height: 34px; padding: 5px 11px; font-size: 14px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--high); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--ink-2); cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--sunk); }
.icon-btn:disabled { opacity: .3; cursor: default; background: none; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 10px; background: var(--sunk); max-width: 100%; }
.seg button {
  border: 0; background: transparent; min-height: 34px; padding: 5px 12px; border-radius: 8px;
  color: var(--ink-2); font-weight: 500; font-size: 14.5px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(24, 32, 51, .12); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.seg .count { font: 500 12px var(--font-mono); color: var(--ink-3); margin-left: 4px; }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1; }
.input {
  width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 9px;
  background: var(--card); color: var(--ink);
}
.input::placeholder { color: var(--ink-3); }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea.input { min-height: 80px; resize: vertical; line-height: 1.45; }
select.input { padding-right: 30px; appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span:first-child, .field-label { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.field-row { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 520px) { .field-row { grid-template-columns: 1fr 1fr; } }
.quick-dates { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- notices ---------- */
.notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); margin-bottom: 14px; }
.notice.info { background: var(--accent-soft); }
.notice.ok { background: var(--done-soft); }
.notice strong { font-weight: 600; }
.notice > div { min-width: 0; }

/* ---------- sync pill ---------- */
.sync {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--ink-2); font: 500 12px/1.2 var(--font-mono); white-space: nowrap;
}
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.sync.ok::before { background: var(--done); }
.sync.busy::before { background: var(--accent); }
.sync.err::before, .sync.off::before { background: var(--warn); }
.sync.err { color: var(--warn); }

/* ---------- MVD cards ---------- */
.mvd-list { display: grid; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.mvd { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 14px 16px 14px 14px; }
.mvd.first { padding: 18px 18px 16px 16px; border-color: var(--accent-line); box-shadow: var(--shadow); }
.mvd-body { min-width: 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--ink-2); }
.rank { font: 500 12.5px var(--font-mono); color: var(--ink-3); }
.mvd.first .rank { color: var(--accent); }
.title { font: 600 17px/1.35 var(--font-body); margin: 4px 0 0; overflow-wrap: anywhere; }
.mvd.first .title { font: 700 22px/1.22 var(--font-display); letter-spacing: -.005em; }
.mvd.done { background: transparent; box-shadow: none; border-color: var(--line); }
.mvd.done .title { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.next {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: baseline;
  margin-top: 12px; padding: 10px 12px; border-radius: 9px; background: var(--accent-soft);
}
.next > span:last-child { overflow-wrap: anywhere; }
.next-label { font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.done-note { margin-top: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; color: var(--ink-2); font-size: 14.5px; }
.done-note .next-label { color: var(--done); }
.done-note span:last-child { overflow-wrap: anywhere; white-space: pre-wrap; }
.add-step { margin-top: 10px; border: 1px dashed var(--line-2); background: none; border-radius: 9px; padding: 8px 12px; color: var(--ink-2); cursor: pointer; font-size: 14px; width: 100%; text-align: left; }
.add-step:hover { border-color: var(--accent); color: var(--accent); }
.mvd-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; margin-left: -6px; }
.mvd-actions .btn.ghost { padding-inline: 8px; }
.details { margin-top: 8px; color: var(--ink-2); font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; border-left: 2px solid var(--line); padding-left: 12px; border-radius: 0; }
.progress { display: flex; align-items: center; gap: 10px; font: 500 12.5px var(--font-mono); color: var(--ink-2); }
.bars { display: flex; gap: 4px; }
.bars i { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
.bars i.on { background: var(--done); }

.check {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--card);
  display: grid; place-items: center; padding: 0; color: transparent; cursor: pointer; flex: none; margin-top: 1px;
}
.mvd.first .check { width: 32px; height: 32px; }
.check:hover { border-color: var(--done); color: var(--done); }
.check.on { background: var(--done); border-color: var(--done); color: var(--done-ink); }
.check.dropped { border-style: dashed; color: var(--ink-3); cursor: default; }
.check.dropped:hover { border-color: var(--line-2); }

.pri { display: inline-flex; align-items: center; gap: 5px; }
.pri::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pri.High { color: var(--high); }
.pri.Medium { color: var(--med); }
.pri.Low { color: var(--low); }
.tag { font: 500 12.5px var(--font-mono); color: var(--ink-2); }
.tag::before { content: "#"; color: var(--ink-3); }
.rep { display: inline-flex; align-items: center; gap: 4px; }
.due-txt { font: 500 12.5px var(--font-mono); }
.due-txt.over { color: var(--high); }
.mvd-badge { font: 500 11.5px var(--font-mono); color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: .04em; }
.carry { color: var(--warn); font-weight: 500; }
.flag { color: var(--warn); background: var(--warn-soft); padding: 2px 8px; border-radius: 6px; font-weight: 600; }

.empty-card { padding: 20px; display: grid; gap: 12px; justify-items: start; }
.empty-card .h2 { font-size: 21px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); }
.steps li::marker { font: 500 13px var(--font-mono); color: var(--accent); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tomorrow { padding: 16px; display: grid; gap: 10px; }
.tomorrow-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.plan-cta { display: grid; gap: 8px; padding: 18px; border: 1px dashed var(--accent-line); border-radius: 14px; background: transparent; }

/* hit-rate strip */
.hit { display: grid; gap: 8px; }
.strip { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; max-width: 360px; }
.strip i { aspect-ratio: 1; max-width: 100%; border-radius: 4px; border: 1px dashed var(--line-2); }
.strip i.hit-y { background: var(--done); border: 0; }
.strip i.hit-n { background: var(--warn-soft); border: 1px solid var(--warn); }
.strip i.today { border: 1px solid var(--accent); }
.hit-line { font-size: 14px; color: var(--ink-2); }
.hit-line b { font: 700 16px var(--font-display); color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-3); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px dashed var(--line-2); }
.legend i.hit-y { background: var(--done); border: 0; }
.legend i.hit-n { background: var(--warn-soft); border: 1px solid var(--warn); }

/* ---------- task rows ---------- */
.toolbar { display: grid; gap: 10px; margin-bottom: 14px; }
.tools { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; }
.tools .search { grid-column: 1 / -1; }
.mini { display: grid; gap: 3px; min-width: 0; }
.mini .label { font-size: 10.5px; padding-left: 2px; }
.tools select.input { min-height: 40px; font-size: 14.5px; padding: 6px 26px 6px 10px; background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; }
@media (min-width: 640px) { .tools { grid-template-columns: minmax(0, 1.7fr) repeat(3, minmax(0, 1fr)); } .tools .search { grid-column: auto; min-height: 40px; } }
.group-label { display: flex; align-items: baseline; gap: 8px; margin: 22px 0 6px; }
.group-label .count { font: 500 12px var(--font-mono); color: var(--ink-3); }
.list { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 2px; border-bottom: 1px solid var(--line); }
.row .check { margin-top: 2px; }
.row-main { display: grid; gap: 3px; min-width: 0; text-align: left; background: none; border: 0; padding: 2px 0; cursor: pointer; color: inherit; }
.row-main:hover .row-title { color: var(--accent); }
.row-title { font-weight: 500; overflow-wrap: anywhere; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-size: 13px; color: var(--ink-2); }
.row-note { font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; white-space: pre-wrap; }
.row-due { font: 500 12.5px var(--font-mono); color: var(--ink-3); padding-top: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row-due.over { color: var(--high); }
.row-due.done { color: var(--done); }
.row.is-done .row-title { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.empty { padding: 28px 4px; color: var(--ink-2); border-bottom: 1px solid var(--line); }
details.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .chev { transition: transform .15s; color: var(--ink-3); }
details.fold[open] > summary .chev { transform: rotate(180deg); }

/* ---------- plan ---------- */
.stepper { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.stepper .bars i { width: 34px; }
.stepper .bars i.on { background: var(--accent); }
.close-list, .pick-list, .prep-list { display: grid; gap: 10px; }
.close-item { padding: 14px; display: grid; gap: 10px; }
.close-title { display: grid; gap: 2px; }
.close-title .t { font-weight: 600; overflow-wrap: anywhere; }
.close-title .m { font-size: 13px; color: var(--ink-2); }
.flag-note { font-size: 13.5px; color: var(--warn); background: var(--warn-soft); padding: 8px 10px; border-radius: 8px; }
.wizard-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.spacer { flex: 1; }
.pick {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; width: 100%; text-align: left;

<body>
<!-- page -->
<div class="shell">

</div>
<button class="fab" id="fab" type="button" data-action="quick" aria-label="Add a task"></button>
<div id="sheet-root" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">This app needs JavaScript turned on.</p></noscript>
<!-- preview-flag -->
<script>
(function () {
'use strict';

const PREVIEW = !!window.MVD_PREVIEW;
const STORE_KEY = PREVIEW ? 'mvd-preview-v1' : 'mvd-v1';
const MAX_MVD = 4;
const AREAS = ['Work', 'Personal'];
const PRIS = ['High', 'Medium', 'Low'];
const PRANK = { High: 0, Medium: 1, Low: 2 };
const REPEATS = [['none', 'Does not repeat'], ['daily', 'Every day'], ['weekdays', 'Every weekday (Mon–Fri)'], ['weekly', 'Every week'], ['monthly', 'Every month']];
const DOW_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_KEYS = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };

/* ================= helpers ================= */
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
const ordinal = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const parseYmd = s => { const p = String(s).slice(0, 10).split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const stamp = () => { const d = new Date(); return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmt = (s, o) => parseYmd(s).toLocaleDateString('en-GB', o);
const dayShort = s => fmt(s, { weekday: 'short', day: 'numeric', month: 'short' });
const dayMonth = s => fmt(s, { day: 'numeric', month: 'short' });
const monthLabel = ym => { const p = ym.split('-').map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); };
const shiftMonth = (ym, n) => { const p = ym.split('-').map(Number); const d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
function relDay(s) {
  const t = today();
  if (s === t) return 'Today';
  if (s === addDays(t, 1)) return 'Tomorrow';
  if (s === addDays(t, -1)) return 'Yesterday';
  return dayShort(s);
}
const relLow = s => { const r = relDay(s); return /^(Today|Tomorrow|Yesterday)$/.test(r) ? r.toLowerCase() : r; };
function normUrl(s) {
  s = String(s || '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  return s;
}
function safeUrl(s) {
  if (!s || /\s/.test(s)) return '';
  try {
    const u = new URL(s);
    if (!/^https?:$/.test(u.protocol)) return '';
    if (u.hostname !== 'localhost' && u.hostname.indexOf('.') < 0) return '';
    return u.href;
  } catch (e) { return ''; }
}
const isTyping = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);

const sv = (p, s) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
const PATHS = {
  today: ['<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>', 22],
  tasks: ['<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.8"/>', 22],
  plan: ['<path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/>', 22],
  report: ['<path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5h4.5"/>', 22],
  settings: ['<path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/>', 22],
  plus: ['<path d="M12 5v14M5 12h14"/>', 24],
  check: ['<path d="M5 12.5 9.5 17 19 7.5"/>', 16],
  ext: ['<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>', 15],
  up: ['<path d="m6 15 6-6 6 6"/>', 18],
  down: ['<path d="m6 9 6 6 6-6"/>', 18],
  left: ['<path d="m15 6-6 6 6 6"/>', 18],
  right: ['<path d="m9 6 6 6-6 6"/>', 18],
  x: ['<path d="M6 6l12 12M18 6 6 18"/>', 16],
  repeat: ['<path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>', 13],
  copy: ['<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>', 16],
  print: ['<path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><path d="M6 14h12v7H6z"/>', 16],
  cloud: ['<path d="M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-1 10z"/><path d="M12 11v6m-2.5-2.5L12 17l2.5-2.5"/>', 16],
  cal: ['<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>', 16]
};
const icon = (name, size) => sv(PATHS[name][0], size || PATHS[name][1]);
const ICON = {};
Object.keys(PATHS).forEach(k => { ICON[k] = icon(k); });

/* ================= store ================= */
const blankPrefs = () => ({ theme: 'auto', remindAt: '21:30', tab: 'Work', sort: 'smart', group: 'none', status: 'open', reminderAdded: false });
const blank = () => ({
  v: 1, tasks: {}, rules: {}, days: {},
  settings: { tags: { id: 'tags', value: { Work: [], Personal: [] }, updated: 0 } },
  dirty: {}, conn: { url: '', key: '' }, sync: { since: 0, lastAt: 0, error: '' },
  prefs: blankPrefs(), seeded: false
});
let storageOk = true;
let S = load();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      const b = blank();
      return Object.assign(b, s, {
        prefs: Object.assign(blankPrefs(), s.prefs || {}),
        settings: Object.assign(b.settings, s.settings || {}),
        sync: Object.assign(b.sync, s.sync || {}),
        conn: Object.assign(b.conn, s.conn || {})
      });
    }
  } catch (e) { storageOk = false; }
  return blank();
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOk = true; } catch (e) { storageOk = false; }
}
function put(type, rec) {
  rec.updated = Math.max(Date.now(), (Number(rec.updated) || 0) + 1);
  S[type][rec.id] = rec;
  S.dirty[type + ':' + rec.id] = 1;
  persist();
  queueSync();
  return rec;
}
const tagsOf = area => ((S.settings.tags && S.settings.tags.value) || {})[area] || [];
function setTags(area, list) {
  const rec = S.settings.tags;
  const v = Object.assign({ Work: [], Personal: [] }, rec.value);
  v[area] = list;
  rec.value = v;
  put('settings', rec);
}
function ensureTag(area, name) {
  name = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 24);
  if (!name) return '';
  const norm = x => x.toLowerCase().replace(/[^a-z0-9]/g, '');
  const found = tagsOf(area).find(t => norm(t) === norm(name));
  if (found) return found;
  setTags(area, tagsOf(area).concat(name));
  return name;
}

/* ================= tasks ================= */
const allTasks = () => Object.values(S.tasks).filter(t => !t.deleted);
const openTasks = () => allTasks().filter(t => t.status === 'Open');
const byOrder = (a, b) => (a.mvdOrder || 9) - (b.mvdOrder || 9) || cmp(String(a.created), String(b.created));
const mvdFor = date => allTasks().filter(t => t.mvdDate === date && t.status !== 'Dropped').sort(byOrder);
const staleFor = date => openTasks().filter(t => t.mvdDate && t.mvdDate < date).sort((a, b) => cmp(a.mvdDate, b.mvdDate) || byOrder(a, b));
const isOverdue = t => t.status === 'Open' && t.due && t.due < today();

function newTask(f) {
  return Object.assign({
    id: uid('t'), title: '', area: 'Work', priority: 'Medium', tag: '', due: '', status: 'Open',
    created: stamp(), completed: '', note: '', mvdDate: '', mvdOrder: 0, firstStep: '', link: '', details: '',
    carryCount: 0, recurId: '', deleted: false, updated: 0
  }, f || {});
}
function dayRec(date) {
  const d = S.days[date];
  return d ? Object.assign({}, d, { items: (d.items || []).slice() }) : { id: date, items: [], updated: 0 };
}
// Remove from a day's MVD. keepHistory leaves the day's log alone, so a miss still counts.
function unplan(t, keepHistory) {
  const prev = t.mvdDate;
  if (prev && !keepHistory && prev >= today()) {
    const d = dayRec(prev);
    const n = d.items.length;
    d.items = d.items.filter(x => x !== t.id);
    if (d.items.length !== n) put('days', d);
  }
  t.mvdDate = '';
  t.mvdOrder = 0;
}
function planFor(t, date, order, keepHistory) {
  if (t.mvdDate && t.mvdDate !== date) unplan(t, keepHistory || t.mvdDate < today());
  t.mvdOrder = order || (mvdFor(date).filter(x => x.id !== t.id).length + 1);
  t.mvdDate = date;
  const d = dayRec(date);
  if (d.items.indexOf(t.id) < 0) { d.items.push(t.id); put('days', d); }
}
function completeTask(t, note) {
  const before = { status: t.status, completed: t.completed, note: t.note };
  const rule = t.recurId && S.rules[t.recurId];
  const ruleBefore = rule ? rule.lastGenerated : null;
  t.status = 'Done';
  t.completed = stamp();
  if (note !== undefined) t.note = note;
  put('tasks', t);
  const created = genRecurring();
  return function undo() {
    Object.assign(t, before);
    put('tasks', t);
    created.forEach(id => { const x = S.tasks[id]; if (x) { x.deleted = true; put('tasks', x); } });
    if (rule) { rule.lastGenerated = ruleBefore; put('rules', rule); }
    render();
  };
}

/* ================= repeats ================= */
function occurs(r, s) {
  const d = parseYmd(s), dow = d.getDay();
  if (r.freq === 'daily') return true;
  if (r.freq === 'weekdays') return dow >= 1 && dow <= 5;
  if (r.freq === 'weekly') return dow === Number(r.day);
  if (r.freq === 'monthly') {
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return d.getDate() === Math.min(Number(r.day) || 1, last);
  }
  return false;
}
function nextOcc(r, from) {
  let s = from;
  for (let i = 0; i < 400; i++) { if (occurs(r, s)) return s; s = addDays(s, 1); }
  return null;
}
function repeatShort(r) {
  if (r.freq === 'daily') return 'Daily';
  if (r.freq === 'weekdays') return 'Weekdays';
  if (r.freq === 'weekly') return 'Weekly, ' + DOW_SHORT[Number(r.day) || 0];
  if (r.freq === 'monthly') return 'Monthly, ' + ordinal(Number(r.day) || 1);
  return '';
}
// Keeps one open copy per repeating task. The next copy appears once the current one is done,
// dated for today or tomorrow, so it shows up when you plan.
function genRecurring() {
  const t0 = today(), horizon = addDays(t0, 1), created = [];
  const openRules = {};
  openTasks().forEach(t => { if (t.recurId) openRules[t.recurId] = 1; });
  Object.values(S.rules).forEach(r => {
    if (r.deleted || !r.active || openRules[r.id]) return;
    let start = t0;
    if (r.lastGenerated && addDays(r.lastGenerated, 1) > start) start = addDays(r.lastGenerated, 1);
    const occ = nextOcc(r, start);
    if (!occ || occ > horizon) return;
    const id = 'r-' + r.id + '-' + occ;
    const fields = { title: r.title, area: r.area, priority: r.priority, tag: r.tag, firstStep: r.firstStep, link: r.link, details: r.details, due: occ, status: 'Open', recurId: r.id, deleted: false, mvdDate: '', mvdOrder: 0, completed: '', note: '', carryCount: 0 };
    const ex = S.tasks[id];
    if (!ex) { put('tasks', newTask(Object.assign({ id }, fields))); created.push(id); }
    else if (ex.deleted) { Object.assign(ex, fields); put('tasks', ex); created.push(id); }
    r.lastGenerated = occ;
    put('rules', r);
  });
  return created;
}
function applyRepeat(t, freq) {
  const cur = t.recurId && S.rules[t.recurId];
  if (freq === 'none') {
    if (cur && cur.active) { cur.active = false; put('rules', cur); }
    return;
  }
  const r = cur || { id: uid('p'), lastGenerated: '', deleted: false };
  const changed = !cur || !cur.active || cur.freq !== freq;
  const base = parseYmd(t.due || today());
  Object.assign(r, { freq, active: true, title: t.title, area: t.area, priority: t.priority, tag: t.tag, firstStep: t.firstStep, link: t.link, details: t.details });
  if (changed) r.day = freq === 'weekly' ? base.getDay() : freq === 'monthly' ? base.getDate() : '';
  if (!t.due) t.due = nextOcc(r, today()) || today();
  if (!r.lastGenerated || t.due > r.lastGenerated) r.lastGenerated = t.due;
  t.recurId = r.id;
  put('rules', r);
}

/* ================= hit rate ================= */
function dayResult(date) {
  const rec = S.days[date];
  if (!rec || !rec.items || !rec.items.length) return null;

  remind: el => { S.prefs.remindAt = el.value || '21:30'; S.prefs.reminderAdded = false; persist(); render(); }
};
const SUBMITS = {
  quick: () => {
    const s = ui.sheet;
    const inp = document.getElementById('qa-input');
    const text = inp ? inp.value : s.text;
    const q = parseQuick(text || '', s.area);
    if (!q.title) { s.err = 'Type a task first.'; renderSheet(); if (inp) document.getElementById('qa-input').focus(); return; }
    put('tasks', newTask({ title: q.title, area: s.area, priority: q.priority, tag: q.tag, due: q.due }));
    s.added.unshift(q.title + (q.due ? ' · due ' + relLow(q.due) : ''));
    s.text = ''; s.err = '';
    renderSheet();
    const i2 = document.getElementById('qa-input'); if (i2) { i2.value = ''; i2.focus(); }
    render();
  },
  edit: () => saveEdit(),
  note: () => {
    const s = ui.sheet, t = S.tasks[s.id];
    const note = (document.getElementById('note-input') || {}).value || s.note;
    if (note.trim().length < 3) return;
    closeSheet();
    const undo = completeTask(t, note.trim());
    render();
    toast('Done: ' + t.title, { label: 'Undo', fn: undo });
  },
  connect: async () => {
    const url = document.getElementById('set-url').value, key = document.getElementById('set-key').value;
    ui.connecting = true; ui.setErr = ''; render();
    const err = await connect(url, key);
    ui.connecting = false; ui.setErr = err;
    render();
    if (!err) {
      toast(S.sync.error ? 'Connected, but the first sync failed. See Settings.' : 'Connected. Changes now save to your Sheet.');
      if (!S.sync.error) { const i = document.getElementById('set-url'); if (i) i.value = ''; }
    } else {
      const u = document.getElementById('set-url'), k = document.getElementById('set-key');
      if (u) u.value = url; if (k) k.value = key;
    }
  },
  'tag-add': f => {
    const area = f.dataset.area, inp = document.getElementById('tag-new-' + area);
    const before = tagsOf(area).length;
    const name = ensureTag(area, inp ? inp.value : '');
    render();
    const again = document.getElementById('tag-new-' + area);
    if (again) { again.value = ''; again.focus(); }
    if (name) toast(tagsOf(area).length > before ? 'Tag added' : 'That tag already exists');
  },
  'plan-new': () => {
    const p = ui.plan, inp = document.getElementById('plan-new');
    const q = parseQuick(inp ? inp.value : '', p.newArea);
    if (!q.title) { if (inp) inp.focus(); return; }
    if (p.selected.length >= MAX_MVD) { toast('Keep it to ' + MAX_MVD + '. Unselect one first.'); return; }
    const t = put('tasks', newTask({ title: q.title, area: p.newArea, priority: q.priority, tag: q.tag, due: q.due }));
    p.selected.push(t.id);
    render();
    const again = document.getElementById('plan-new'); if (again) { again.value = ''; again.focus(); }
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) {
    if (e.target.dataset && e.target.dataset.scrim) closeSheet();
    return;
  }
  if (el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.input; if (k && INPUTS[k]) INPUTS[k](e.target, e); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.change; if (k && CHANGES[k]) CHANGES[k](e.target, e); });
document.addEventListener('submit', e => { const f = e.target, k = f.dataset && f.dataset.submit; if (!k) return; e.preventDefault(); if (SUBMITS[k]) SUBMITS[k](f, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.sheet) { e.preventDefault(); closeSheet(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    const f = e.target.closest && e.target.closest('form[data-submit]');
    if (f) { e.preventDefault(); const k = f.dataset.submit; if (SUBMITS[k]) SUBMITS[k](f, e); }
    return;
  }
  if ((e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey && !e.altKey && !ui.sheet && !isTyping(e.target)) { e.preventDefault(); openQuick(); }
});

/* ================= theme, examples, boot ================= */
// In the preview, the page host may set its own theme on the root element; "Match device" hands control back to it.
let hostTheme = PREVIEW ? document.documentElement.getAttribute('data-theme') : null;
let lastTheme;
const THEME_COLOR = { light: '#F3F4F7', dark: '#0F131B' };
function applyTheme() {
  const root = document.documentElement, th = S.prefs.theme;
  const explicit = th === 'light' || th === 'dark';
  const want = explicit ? th : hostTheme;
  lastTheme = want || null;
  if (want) root.setAttribute('data-theme', want); else root.removeAttribute('data-theme');
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    if (!m.dataset.orig) m.dataset.orig = m.content;
    m.content = explicit ? THEME_COLOR[th] : m.dataset.orig;
  });
  try { localStorage.setItem(STORE_KEY + '-theme', explicit ? th : 'auto'); } catch (e) { /* storage blocked */ }
}
if (PREVIEW && window.MutationObserver) {
  let fights = 0, windowStart = 0;
  new MutationObserver(() => {
    const cur = document.documentElement.getAttribute('data-theme');
    if (cur === lastTheme) return;
    hostTheme = cur;
    if (S.prefs.theme === 'light' || S.prefs.theme === 'dark') {
      const now = Date.now();
      if (now - windowStart > 2000) { windowStart = now; fights = 0; }
      if (++fights <= 5) applyTheme();
    } else {
      lastTheme = cur;
    }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
function seedExamples() {
  const t = today(), ms = t.slice(0, 8) + '01';
  const back = n => { const d = addDays(t, -n); return d < ms ? ms : d; };
  const mk = f => { const x = newTask(Object.assign({ tag: 'Example', created: addDays(t, -6) + 'T09:00' }, f)); x.updated = Date.now(); S.tasks[x.id] = x; return x; };
  S.settings.tags = { id: 'tags', value: { Work: ['Example'], Personal: ['Example'] }, updated: Date.now() };
  const a = mk({ title: 'Draft the weekly status update', area: 'Work', priority: 'High', mvdDate: t, mvdOrder: 1,
    firstStep: 'Open last week’s update and copy its outline into a new doc', details: 'Cover what shipped, what is blocked and what needs a decision.' });
  const b = mk({ title: 'Reply to the two pending approval emails', area: 'Work', priority: 'Medium', mvdDate: t, mvdOrder: 2, firstStep: 'Search the inbox for “approval” and open the oldest one' });
  const c = mk({ title: 'Pay the electricity bill', area: 'Personal', priority: 'Medium', mvdDate: t, mvdOrder: 3, firstStep: 'Open the banking app and go to Bills', due: t });
  const y = addDays(t, -1);
  const stale = mk({ title: 'Clean up the shared folder structure', area: 'Work', priority: 'Low', mvdDate: y, mvdOrder: 2, carryCount: 2, firstStep: 'List the top-level folders in a note' });
  mk({ title: 'Prepare the agenda for Monday’s review', area: 'Work', priority: 'High', due: addDays(t, 1) });
  mk({ title: 'Book a dentist appointment', area: 'Personal', priority: 'Low', due: addDays(t, 4) });
  mk({ title: 'Renew the vehicle insurance', area: 'Personal', priority: 'High', due: addDays(t, 9) });
  const dn = (title, note, n, pri) => { const d = back(n); return mk({ title, area: 'Work', priority: pri, status: 'Done', completed: d + 'T17:40', note, created: addDays(d, -2) + 'T10:00' }); };
  const d1 = dn('Update the project tracker', 'Statuses updated for all open items. Tracker is in the shared drive.', 1, 'Medium');
  const d2 = dn('Send meeting notes to the team', 'Notes and three action items sent by email to the team list.', 2, 'Medium');
  const d3 = dn('Review the draft procedure', 'Returned with 6 comments in the document. Author to revise by Friday.', 2, 'High');
  dn('Fix the broken link in the onboarding page', 'Link replaced; checked on phone and laptop.', 3, 'Low');
  const d5 = dn('Collect quotes for the new printer', 'Three quotes saved in the purchase folder; cheapest flagged.', 3, 'Medium');
  [[y, [d1.id, stale.id]], [addDays(t, -2), [d2.id, d3.id]], [addDays(t, -3), [d5.id]]].forEach(([d, items]) => {
    if (S.tasks[items[0]].completed.slice(0, 10) === d) S.days[d] = { id: d, items, updated: Date.now() };
  });
  S.days[t] = { id: t, items: [a.id, b.id, c.id], updated: Date.now() };
  const rid = 'pexample';
  S.rules[rid] = { id: rid, title: 'Weekly review of open tasks', area: 'Work', priority: 'Medium', tag: 'Example', freq: 'weekly', day: parseYmd(addDays(t, 1)).getDay(), firstStep: 'Open the Tasks tab, Work, sorted by due date', link: '', details: '', active: true, lastGenerated: addDays(t, -6), deleted: false, updated: Date.now() };
  S.seeded = true;
  S.dirty = {};
  persist();
}
function tick() {
  const t = today();
  if (t !== lastDay) {
    lastDay = t;
    genRecurring();
    if (ui.plan && ui.plan.step !== 'done' && ui.plan.target < t) ui.plan = null;
    if (ui.reportMonth > t.slice(0, 7)) ui.reportMonth = t.slice(0, 7);
    render();
  } else if (document.visibilityState === 'visible' && connected() && Date.now() - (S.sync.lastAt || 0) > 90000) {
    syncNow();
  }
}
function boot() {
  applyTheme();
  if (PREVIEW && !S.seeded && !Object.keys(S.tasks).length) seedExamples();
  genRecurring();
  render();
  if (connected()) syncNow();
  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); syncNow(); } });
  window.addEventListener('online', () => { paintSync(); syncNow(); });
  window.addEventListener('offline', paintSync);
  window.addEventListener('storage', e => { if (e.key === STORE_KEY) { S = load(); render(); } });
  if (!PREVIEW && 'serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline cache unavailable */ });
  }
}
boot();
})();
